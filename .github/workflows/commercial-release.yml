name: commercial-release-gates

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run test:commercial
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint -- --quiet
      - run: npm run build:app
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-sbom
          path: sbom.cdx.json

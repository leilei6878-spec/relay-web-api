name: commercial-release-gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: commercial-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run test:commercial
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint -- --quiet
      - run: npm run build:app
      - name: Generated source remains clean
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=no)"
      - name: Validate production Compose contract
        run: docker compose --profile ops -f docker-compose.production.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-only
          S3_ACCESS_KEY: ci-only
          S3_SECRET_KEY: ci-only-secret
          S3_BUCKET: relay-ci
          RELAY_ADMIN_TOKEN: ci-only
          RELAY_WORKER_TOKEN: ci-only
          RELAY_SECRETS_KEY: ci-only-secret-key-0123456789abcdef
          RELAY_PUBLIC_URL: https://relay.example.test
          RELAY_RELEASE_SHA: ${{ github.sha }}
      - name: Build and inspect recovery runner
        run: |
          docker build -f Dockerfile.backup -t relay-backup:${GITHUB_SHA} .
          docker run --rm --entrypoint /bin/sh relay-backup:${GITHUB_SHA} -c 'node --version && pg_dump --version && pg_restore --version && mc --version && git --version'
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Generate production CycloneDX SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > sbom.cdx.json
      - name: Generate commit-bound release manifest
        run: |
          node scripts/release-manifest.mjs --sbom sbom.cdx.json --out release-manifest.json
          sha256sum -c release-manifest.json.sha256
        env:
          RELAY_RELEASE_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commercial-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            sbom.cdx.json
            release-manifest.json
            release-manifest.json.sha256

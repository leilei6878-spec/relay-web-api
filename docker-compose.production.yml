services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: relay
    volumes:
      - relay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - relay_minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          i=$$((i+1))
          if [ $$i -gt 40 ]; then echo "minio not ready"; exit 1; fi
          sleep 1
        done
        mc mb -p "local/$$S3_BUCKET" || true
        echo "minio bucket ready"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/relay
      REDIS_URL: redis://redis:6379
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:?Set RELAY_ADMIN_TOKEN in .env}
      RELAY_ADMIN_USERNAME: ${RELAY_ADMIN_USERNAME:-}
      RELAY_ADMIN_PASSWORD_HASH: ${RELAY_ADMIN_PASSWORD_HASH:-}
      RELAY_REQUIRE_ADMIN_MFA: ${RELAY_REQUIRE_ADMIN_MFA:-0}
      RELAY_ADMIN_TOTP_SECRET: ${RELAY_ADMIN_TOTP_SECRET:-}
      RELAY_ADMIN_SESSION_HOURS: ${RELAY_ADMIN_SESSION_HOURS:-12}
      RELAY_ALLOW_REMOTE_ADMIN_TOKEN_LOGIN: ${RELAY_ALLOW_REMOTE_ADMIN_TOKEN_LOGIN:-0}
      RELAY_ALLOW_REMOTE_ADMIN_BEARER: ${RELAY_ALLOW_REMOTE_ADMIN_BEARER:-0}
      RELAY_WORKER_TOKEN: ${RELAY_WORKER_TOKEN:?Set RELAY_WORKER_TOKEN in .env}
      RELAY_SECRETS_KEY: ${RELAY_SECRETS_KEY:?Set RELAY_SECRETS_KEY in .env}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:?Set RELAY_PUBLIC_URL in .env}
      RELAY_RELEASE_SHA: ${RELAY_RELEASE_SHA:?Set RELAY_RELEASE_SHA to the exact git commit}
      RELAY_BUILD_TIME: ${RELAY_BUILD_TIME:-unknown}
      RELAY_S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      RELAY_S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      RELAY_S3_REGION: ${S3_REGION:-us-east-1}
      RELAY_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      RELAY_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      RELAY_REQUIRE_ADMIN_LOGIN: ${RELAY_REQUIRE_ADMIN_LOGIN:-1}
      RELAY_ACCOUNT_CHECK_CONCURRENCY: ${RELAY_ACCOUNT_CHECK_CONCURRENCY:-2}
      RELAY_SKIP_ACCOUNT_CHECK_SCHEDULER: ${RELAY_SKIP_ACCOUNT_CHECK_SCHEDULER:-0}
      RELAY_SKIP_ACCOUNT_ANALYTICS: ${RELAY_SKIP_ACCOUNT_ANALYTICS:-0}
      RELAY_COMMERCIAL_ENABLED: ${RELAY_COMMERCIAL_ENABLED:-0}
      RELAY_SAAS_REGISTRATION_ENABLED: ${RELAY_SAAS_REGISTRATION_ENABLED:-0}
      RELAY_LEGAL_APPROVED: ${RELAY_LEGAL_APPROVED:-0}
      RELAY_SAAS_EMAIL_VERIFICATION_REQUIRED: ${RELAY_SAAS_EMAIL_VERIFICATION_REQUIRED:-1}
      RELAY_EMAIL_WEBHOOK_URL: ${RELAY_EMAIL_WEBHOOK_URL:-}
      RELAY_GATEWAY_REPLICA_COUNT: ${RELAY_GATEWAY_REPLICA_COUNT:-1}
      RELAY_COMMERCIAL_MIN_WORKERS: ${RELAY_COMMERCIAL_MIN_WORKERS:-2}
      RELAY_ALLOW_LIVE_PROVIDER_CANARY: ${RELAY_ALLOW_LIVE_PROVIDER_CANARY:-0}
      RELAY_CANARY_MAX_CHARGE_MINOR: ${RELAY_CANARY_MAX_CHARGE_MINOR:-100}
      RELAY_PROVIDER_CANARY_MAX_AGE_HOURS: ${RELAY_PROVIDER_CANARY_MAX_AGE_HOURS:-24}
      RELAY_PAYMENT_PROVIDER: ${RELAY_PAYMENT_PROVIDER:-disabled}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RELAY_STRIPE_MAX_RECHARGE_MINOR: ${RELAY_STRIPE_MAX_RECHARGE_MINOR:-1000000}
      RELAY_ALLOW_MANUAL_CUSTOMER_ORDERS: ${RELAY_ALLOW_MANUAL_CUSTOMER_ORDERS:-0}
      RELAY_TAX_MODE: ${RELAY_TAX_MODE:-unconfigured}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      LEONARDO_API_KEY: ${LEONARDO_API_KEY:-}
      LEONARDO_MODEL_MAP_JSON: ${LEONARDO_MODEL_MAP_JSON:-{}}
      RELAY_ALERT_WEBHOOK_URL: ${RELAY_ALERT_WEBHOOK_URL:-}
      RELAY_BACKUP_S3_ENDPOINT: ${RELAY_BACKUP_S3_ENDPOINT:-}
      RELAY_BACKUP_S3_BUCKET: ${RELAY_BACKUP_S3_BUCKET:-}
      RELAY_REQUEST_CONTENT_RETENTION_DAYS: ${RELAY_REQUEST_CONTENT_RETENTION_DAYS:-30}
      RELAY_SESSION_RETENTION_DAYS: ${RELAY_SESSION_RETENTION_DAYS:-30}
      RELAY_OPERATIONAL_RETENTION_DAYS: ${RELAY_OPERATIONAL_RETENTION_DAYS:-90}
      RELAY_AUDIT_RETENTION_DAYS: ${RELAY_AUDIT_RETENTION_DAYS:-365}
      RELAY_SKIP_COMMERCIAL_MONITOR: ${RELAY_SKIP_COMMERCIAL_MONITOR:-0}
      RELAY_SKIP_PLAN_RENEWAL: ${RELAY_SKIP_PLAN_RENEWAL:-0}
      RELAY_SKIP_RETENTION: ${RELAY_SKIP_RETENTION:-0}
    volumes:
      - ${RELAY_STORAGE_HOST:-relay_storage}:/app/storage
      - ${RELAY_XRAY_BIN:-./bin/xray}:/app/bin/xray:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RELAY_BIND:-127.0.0.1:8088}:8080"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - gateway
    environment:
      NODE_ENV: production
      RELAY_HEADLESS: "1"
      RELAY_GATEWAY: ${RELAY_GATEWAY:-http://gateway:8080}
      RELAY_WORKER_TOKEN: ${RELAY_WORKER_TOKEN:?Set RELAY_WORKER_TOKEN in .env}
      RELAY_TOKEN: ${RELAY_WORKER_TOKEN:?Set RELAY_WORKER_TOKEN in .env}
      RELAY_RELEASE_SHA: ${RELAY_RELEASE_SHA:?Set RELAY_RELEASE_SHA to the exact git commit}
      RELAY_WORKER_NAME: worker-1
      RELAY_CAPACITY: ${MAX_WORKER_CONCURRENCY:-3}
    shm_size: "2gb"
    init: true
    restart: unless-stopped

volumes:
  relay_pg:
  relay_minio:
  relay_storage:

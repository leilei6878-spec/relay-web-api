openapi: 3.1.0
info:
  title: Relay Public API
  version: 0.10.0-rc1
  description: |
    OpenAI-compatible API. Commercial `sk-saas-*` credentials are routed only
    to official provider APIs. Legacy `sk-relay-*` credentials are internal.
    Admin and Worker endpoints are intentionally omitted.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/models:
    get:
      summary: List models
      operationId: listModels
      responses:
        "200":
          description: Model list
  /v1/chat/completions:
    post:
      summary: Chat completions (official API for commercial tenants)
      operationId: chatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionsRequest"
      responses:
        "200":
          description: Completion or SSE stream
        "400":
          description: Invalid input
        "401":
          description: Missing/invalid API key
        "403":
          description: Key lacks chat scope
        "429":
          description: Rate limited
        "402":
          description: Insufficient prepaid balance or budget
  /v1/responses:
    post:
      summary: Responses API (OpenAI-compatible subset)
      operationId: responses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponsesRequest"
      responses:
        "200":
          description: Response object or SSE
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
  /v1/images/generations:
    post:
      summary: Image generation (official API for commercial tenants)
      operationId: imageGenerations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationsRequest"
      responses:
        "200":
          description: Image result with stable media URL
        "401":
          description: Unauthorized
        "422":
          description: Provider failed closed (no fake success)
  /v1/images/edits:
    post:
      summary: Image edits (reference image, no mask)
      operationId: imageEdits
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                prompt:
                  type: string
                model:
                  type: string
                mask:
                  type: string
                  format: binary
                  description: Unsupported; returns 400
      responses:
        "200":
          description: Edited image
        "400":
          description: Unsupported parameter (mask) or invalid input
        "401":
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Commercial tenant key (`sk-saas-*`). Legacy `sk-relay-*` keys are reserved for internal compatibility. Worker and Admin tokens are rejected.
  schemas:
    ChatCompletionsRequest:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        model:
          type: string
        stream:
          type: boolean
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                oneOf:
                  - type: string
                  - type: array
    ResponsesRequest:
      type: object
      properties:
        model:
          type: string
        input:
          description: String or item list
        stream:
          type: boolean
    ImageGenerationsRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        model:
          type: string
        n:
          type: integer
        size:
          type: string
